<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>示例页面 — Dark Theme</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <div style="font-size:1rem">Shop Demo</div>
          <div class="kicker">Dark theme example</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <button class="btn primary">Sign in</button>
      </nav>
    </header>

    <section class="hero card">
      <h1>欢迎来到示例商店</h1>
      <p>这是一个使用 styles.css 深色主题样式表的示例页面。将 styles.css 放在相同目录并通过 &lt;link&gt; 引入。</p>
    </section>

    <main class="grid columns-3 mt-2">
      <article class="card card-hover">
        <div class="card-media"></div>
        <h3 class="card-title">产品 A</h3>
        <div class="card-meta muted">￥99.00</div>
        <p class="mt-1">简短的产品描述，让用户了解亮点与用途。</p>
        <div class="mt-1">
          <button class="btn primary">购买</button>
          <button class="btn ghost">详情</button>
        </div>
      </article>

      <article class="card card-hover">
        <div class="card-media"></div>
        <h3 class="card-title">产品 B</h3>
        <div class="card-meta muted">￥149.00</div>
        <p class="mt-1">高品质且设计优雅，适合日常使用。</p>
        <div class="mt-1">
          <button class="btn primary">购买</button>
          <button class="btn ghost">详情</button>
        </div>
      </article>

      <article class="card card-hover">
        <div class="card-media"></div>
        <h3 class="card-title">产品 C</h3>
        <div class="card-meta muted">￥229.00</div>
        <p class="mt-1">旗舰款，包含更多功能和延长保修。</p>
        <div class="mt-1">
          <button class="btn primary">购买</button>
          <button class="btn ghost">详情</button>
        </div>
      </article>
    </main>

    <footer class="footer">
      © 2026 Shop Demo · Built with dark theme styles.css
    </footer>
  </div>
</body>
</html>
