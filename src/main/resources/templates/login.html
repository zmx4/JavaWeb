<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body>
<div class="container">
    <div th:replace="~{fragments/navigation :: topNav('login')}"></div>

    <div class="card auth-card">
        <h2>用户登录</h2>

        <div th:if="${error}" class="alert danger" th:text="${error}"></div>

        <form th:action="@{/user/login}" th:object="${loginRequest}" method="post" class="stack-form">
            <div class="form-group">
                <label>用户名</label>
                <input class="input" type="text" th:field="*{username}" placeholder="请输入用户名"/>
                <div class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <label>密码</label>
                <input class="input" type="password" th:field="*{password}" placeholder="请输入密码"/>
                <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn primary">登 录</button>
        </form>

        <div class="link-text mt-2">
            还没有账号？<a th:href="@{/user/register}">立即注册</a>
        </div>
    </div>
</div>
</body>
</html>
