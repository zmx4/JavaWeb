<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>

</head>
<body>
<div class="login-container">
    <h2>用户登录</h2>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/user/login}" th:object="${loginRequest}" method="post">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" th:field="*{username}" placeholder="请输入用户名"/>
            <div class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="form-group">
            <label>密码</label>
            <input type="password" th:field="*{password}" placeholder="请输入密码"/>
            <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn">登 录</button>
    </form>

    <div class="link-text">
        还没有账号？<a th:href="@{/user/register}">立即注册</a>
    </div>
</div>
</body>
</html>
